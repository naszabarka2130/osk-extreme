  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ted callout bg*/\n  --osk-amber-deep:oklch(55%   0.15  55);   /*          pressed / hover  */\n\n  /* ---- Color: Semantic --------------------------------------------------- */\n  --bg:            var(--osk-cream);\n  --bg-elevated:   var(--osk-paper);\n  --bg-outer:      var(--osk-paper-2);\n  --bg-inverse:    var(--osk-ink);\n\n  --fg:            var(--osk-ink);\n  --fg-muted:      var(--osk-ink-mid);\n  --fg-soft:       var(--osk-ink-soft);\n  --fg-on-dark:    var(--osk-cream);\n\n  --accent:        var(--osk-amber);\n  --accent-bg:     var(--osk-amber-bg);\n  --accent-press:  var(--osk-amber-deep);\n\n  --border:        var(--osk-paper);\n  --rule:          color-mix(in oklch, var(--osk-ink) 12%, transparent);\n\n  /* ---- Type: Families ---------------------------------------------------- */\n  --font-serif:    'Lora', Georgia, 'Times New Roman', serif;       /* body */\n  --font-display:  'Playfair Display', Georgia, serif;              /* titles */\n  --font-mono:     ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\n\n  /* ---- Type: Scale (mobile-first; designs are 390px column) -------------- */\n  --fs-eyebrow:    11px;   /* uppercase chapter / divider labels */\n  --fs-micro:      10px;   /* tiny labels (scenario, footer)     */\n  --fs-caption:    13px;\n  --fs-body:       14.5px; /* default running text                */\n  --fs-body-lg:    15.5px; /* lead paragraph                      */\n  --fs-pull:       17px;   /* highlight / pull sentence           */\n  --fs-h3:         20px;\n  --fs-h2:         26px;\n  --fs-h1:         32px;   /* chapter title                       */\n\n  --lh-tight:      1.1;\n  --lh-snug:       1.5;\n  --lh-body:       1.68;\n  --lh-loose:      1.72;\n\n  --tracking-eyebrow: 0.18em;\n  --tracking-micro:   0.16em;\n  --tracking-caps:    0.22em;   /* OSK / EXTREME wordmark        */\n  --tracking-tight:  -0.02em;   /* large display titles          */\n\n  /* ---- Spacing ----------------------------------------------------------- */\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-7:  32px;\n  --sp-8:  40px;\n  --sp-9:  56px;\n\n  --gutter:        32px;       /* card horizontal padding      */\n  --column:        390px;      /* canonical reading column      */\n\n  /* ---- Radius ----------------------------------------------------------- */\n  --radius-sharp:  0;\n  --radius-xs:     2px;        /* 95% of components             */\n  --radius-sm:     4px;\n  --radius-pill:   999px;\n\n  /* ---- Borders & rules -------------------------------------------------- */\n  --rule-thin:     1px solid var(--osk-paper);\n  --accent-rule:   2px solid var(--osk-amber);\n  --left-accent:   3px solid var(--osk-amber);\n  --top-bar:       5px solid var(--osk-ink);\n}\n\n/* ==========================================================================\n   Semantic element styles — drop this stylesheet on any page and get\n   reasonable OSK Extreme defaults.\n   ========================================================================== */\n\nhtml, body {\n  background: var(--bg-outer);\n  color: var(--fg);\n  font-family: var(--font-serif);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, .h1 {\n  font-family: var(--font-display);\n  font-weight: 900;\n  font-size: var(--fs-h1);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\nh1 em, .h1 em {\n  font-style: italic;\n  color: var(--accent);\n}\n\nh2, .h2 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-h2);\n  line-height: 1.2;\n  letter-spacing: -0.01em;\n  color: var(--fg);\n}\n\nh3, .h3 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-h3);\n  line-height: 1.3;\n  color: var(--fg);\n}\n\np {\n  font-family: var(--font-serif);\n  font-size: var(--fs-body);\n  line-height: var(--lh-loose);\n  color: var(--fg);\n  text-wrap: pretty;\n}\np + p { margin-top: var(--sp-3); }\n\n.lead {\n  font-size: var(--fs-body-lg);\n  line-height: var(--lh-body);\n}\n\n.muted   { color: var(--fg-muted); }\n.soft    { color: var(--fg-soft); }\n\n/* eyebrow / chapter label */\n.eyebrow {\n  font-family: var(--font-serif);\n  font-size: var(--fs-eyebrow);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--accent);\n  font-weight: 500;\n  display: inline-flex;\n  align-items: center;\n  gap: var(--sp-2);\n}\n.eyebrow::before {\n  content: '';\n  display: inline-block;\n  width: 20px;\n  height: 2px;\n  background: currentColor;\n}\n\n/* divider label (neutral version of eyebrow) */\n.divider-label {\n  font-family: var(--font-serif);\n  font-size: var(--fs-micro);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--fg-soft);\n  font-weight: 500;\n}\n\n/* highlight / pull sentence used inside lessons */\n.highlight {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-pull);\n  line-height: var(--lh-snug);\n  color: var(--fg);\n  text-wrap: pretty;\n}\n.highlight em {\n  font-style: italic;\n  color: var(--accent);\n}\n\na {\n  color: var(--accent);\n  text-decoration: none;\n  border-bottom: 1px solid color-mix(in oklch, var(--accent) 35%, transparent);\n  transition: border-color 120ms ease, color 120ms ease;\n}\na:hover  { border-bottom-color: var(--accent); }\na:active { color: var(--accent-press); }\n\ncode, pre, kbd {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n}\ncode {\n  background: var(--accent-bg);\n  padding: 1px 5px;\n  border-radius: var(--radius-xs);\n}\n<\u002Fstyle>\n\n<style>\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n  body {\n    background: var(--osk-paper-2);\n    display: flex;\n    justify-content: center;\n    align-items: flex-start;\n    padding: 32px 16px 48px;\n    min-height: 100vh;\n    font-family: var(--font-serif);\n  }\n\n  .card {\n    width: 390px;\n    background: var(--osk-cream);\n    color: var(--osk-ink);\n    position: relative;\n    overflow: hidden;\n  }\n\n  .top-bar { background: var(--osk-ink); height: 5px; width: 100%; }\n\n  /* Logo */\n  .logo-bar { padding: 20px 32px 16px; display: flex; align-items: center; gap: 10px; }\n  .logo-mark { width: 30px; height: 30px; background: var(--osk-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n  .logo-mark svg { width: 16px; height: 16px; }\n  .logo-text { display: flex; flex-direction: column; line-height: 1; gap: 2px; }\n  .logo-osk { font-family: var(--font-serif); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--osk-ink-soft); font-weight: 500; }\n  .logo-extreme { font-family: var(--font-display); font-size: 15px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; color: var(--osk-ink); }\n\n  /* Header */\n  .header { padding: 36px 32px 28px; border-bottom: 1px solid var(--osk-paper); position: relative; }\n  .chapter-label {\n    font-family: var(--font-serif);\n    font-size: 11px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--osk-amber);\n    font-weight: 500;\n    margin-bottom: 14px;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n  }\n  .chapter-label::before {\n    content: '';\n    display: inline-block;\n    width: 20px;\n    height: 2px;\n    background: var(--osk-amber);\n  }\n  .title {\n    font-family: var(--font-display);\n    font-size: 32px;\n    font-weight: 900;\n    line-height: 1.1;\n    letter-spacing: -0.02em;\n    color: var(--osk-ink);\n  }\n  .title em { font-style: italic; color: var(--osk-amber); }\n  .title-sub {\n    margin-top: 14px;\n    font-family: var(--font-serif);\n    font-style: italic;\n    font-size: 14px;\n    color: var(--osk-ink-mid);\n    line-height: 1.55;\n  }\n  .blinker-deco { position: absolute; top: 32px; right: 28px; display: flex; gap: 4px; opacity: 0.2; }\n  .blinker-deco span {\n    display: block;\n    width: 8px;\n    height: 8px;\n    background: var(--osk-amber);\n    clip-path: polygon(0 50%, 40% 0, 100% 0, 100% 100%, 40% 100%);\n  }\n  .blinker-deco span:nth-child(1) { opacity: 0.4; }\n  .blinker-deco span:nth-child(2) { opacity: 0.7; }\n  .blinker-deco span:nth-child(3) { opacity: 1; }\n\n  /* Body */\n  .body { padding: 0 32px 36px; }\n  .section { padding: 28px 0; border-bottom: 1px solid var(--osk-paper); }\n  .section:last-child { border-bottom: none; }\n\n  p { font-size: 14.5px; line-height: 1.72; color: var(--osk-ink); text-wrap: pretty; }\n  p + p { margin-top: 12px; }\n\n  .lead { font-size: 15.5px; line-height: 1.68; color: var(--osk-ink); }\n\n  .divider-label {\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--osk-ink-soft);\n    margin-bottom: 14px;\n    font-weight: 500;\n  }\n\n  /* Definition pull-quote */\n  .definition {\n    background: var(--osk-ink);\n    color: var(--osk-cream);\n    padding: 28px 26px 26px;\n    margin: 0 -32px;\n  }\n  .definition::before {\n    content: '→';\n    font-size: 28px;\n    color: var(--osk-amber);\n    display: block;\n    margin-bottom: 12px;\n    line-height: 1;\n  }\n  .definition .def-label {\n    font-family: var(--font-serif);\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--osk-amber);\n    margin-bottom: 12px;\n    font-weight: 500;\n  }\n  .definition p {\n    color: var(--osk-cream);\n    font-size: 15px;\n    line-height: 1.7;\n    font-style: italic;\n  }\n  .definition strong { font-style: normal; color: var(--osk-amber); font-weight: 500; }\n\n  /* Examples */\n  .example-num {\n    font-family: var(--font-display);\n    font-style: italic;\n    font-size: 13px;\n    color: var(--osk-amber);\n    letter-spacing: 0.04em;\n    margin-bottom: 4px;\n    font-weight: 700;\n  }\n  .example-title {\n    font-family: var(--font-display);\n    font-size: 22px;\n    font-weight: 700;\n    line-height: 1.18;\n    letter-spacing: -0.015em;\n    color: var(--osk-ink);\n    margin-bottom: 16px;\n  }\n\n  /* Scenario block (the action) */\n  .scenario {\n    background: var(--osk-paper);\n    border-left: 3px solid var(--osk-amber);\n    padding: 18px 18px 18px 20px;\n    margin-top: 16px;\n  }\n  .scenario-label {\n    font-size: 10px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--osk-amber);\n    font-weight: 600;\n    margin-bottom: 10px;\n  }\n  .scenario p {\n    font-size: 13.5px;\n    line-height: 1.7;\n    color: var(--osk-ink-mid);\n  }\n  .scenario p + p { margin-top: 10px; }\n\n  /* Effect callout */\n  .effect {\n    margin-top: 18px;\n    padding: 14px 16px 14px 18px;\n    background: var(--osk-amber-bg);\n    display: grid;\n    grid-template-columns: 22px 1fr;\n    gap: 12px;\n    align-items: start;\n    border-radius: 2px;\n  }\n  .effect-mark {\n    margin-top: 2px;\n    width: 22px;\n    height: 22px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n  }\n  .effect-mark svg { width: 22px; height: 22px; }\n  .effect-label {\n    font-family: var(--font-serif);\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--osk-amber);\n    font-weight: 600;\n    margin-bottom: 4px;\n  }\n  .effect-text {\n    font-size: 13.5px;\n    line-height: 1.6;\n    color: var(--osk-ink);\n  }\n  .effect-text em { font-style: italic; color: var(--osk-ink-mid); }\n\n  /* Question — for examples that pose one */\n  .question {\n    margin-top: 14px;\n    font-family: var(--font-display);\n    font-style: italic;\n    font-weight: 700;\n    font-size: 16px;\n    color: var(--osk-ink);\n    line-height: 1.4;\n  }\n  .question::before {\n    content: '?';\n    display: inline-block;\n    width: 22px;\n    height: 22px;\n    margin-right: 10px;\n    background: var(--osk-amber);\n    color: var(--osk-cream);\n    text-align: center;\n    line-height: 22px;\n    font-style: normal;\n    font-weight: 900;\n    font-size: 14px;\n    vertical-align: 2px;\n  }\n\n  /* Highlight (key rule) */\n  .highlight {\n    font-family: var(--font-display);\n    font-weight: 700;\n    font-size: 17px;\n    line-height: 1.5;\n    color: var(--osk-ink);\n    text-wrap: pretty;\n  }\n  .highlight em { font-style: italic; color: var(--osk-amber); }\n\n  /* Section eyebrow strip */\n  .strip {\n    margin: 0 -32px;\n    padding: 18px 32px;\n    background: var(--osk-paper);\n    border-top: 1px solid var(--osk-paper-2);\n    border-bottom: 1px solid var(--osk-paper-2);\n  }\n  .strip .strip-label {\n    font-family: var(--font-serif);\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--osk-amber);\n    font-weight: 600;\n    margin-bottom: 6px;\n  }\n  .strip .strip-text {\n    font-family: var(--font-display);\n    font-style: italic;\n    font-weight: 700;\n    font-size: 18px;\n    line-height: 1.35;\n    color: var(--osk-ink);\n  }\n\n  /* Examples header */\n  .examples-header {\n    text-align: center;\n    padding: 32px 0 8px;\n  }\n  .examples-header .eh-num {\n    font-family: var(--font-display);\n    font-style: italic;\n    font-size: 56px;\n    font-weight: 900;\n    color: var(--osk-amber);\n    line-height: 1;\n    letter-spacing: -0.04em;\n  }\n  .examples-header .eh-label {\n    margin-top: 8px;\n    font-family: var(--font-serif);\n    font-size: 11px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--osk-ink-soft);\n    font-weight: 500;\n  }\n  .examples-header .eh-rule {\n    width: 28px;\n    height: 2px;\n    background: var(--osk-amber);\n    margin: 14px auto 0;\n  }\n\n  /* Footer */\n  .footer {\n    background: var(--osk-paper);\n    padding: 18px 32px;\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    border-top: 2px solid var(--osk-amber);\n  }\n  .footer-stack { display: flex; flex-direction: column; gap: 2px; line-height: 1; }\n  .footer-osk { font-family: var(--font-serif); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--osk-ink-soft); }\n  .footer-ext { font-family: var(--font-display); font-size: 17px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; color: var(--osk-ink); }\n  .footer-indicator { margin-left: auto; display: flex; gap: 3px; align-items: center; }\n  .fi-arrow {\n    width: 9px; height: 9px;\n    background: var(--osk-amber);\n    clip-path: polygon(0 50%, 35% 0, 100% 0, 100% 100%, 35% 100%);\n  }\n  .fi-arrow.dim { opacity: 0.3; }\n\n  .progress {\n    text-align: center;\n    padding-top: 14px;\n    font-family: var(--font-serif);\n    font-size: 10px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--osk-ink-soft);\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"card\">\n  <div class=\"top-bar\"><\u002Fdiv>\n\n  <div class=\"logo-bar\">\n    <div class=\"logo-mark\">\n      <svg viewBox=\"0 0 16 16\" fill=\"none\">\n        <path d=\"M2 8 L8 2 L14 8 L8 14 Z\" fill=\"var(--osk-amber)\"><\u002Fpath>\n        <path d=\"M5 8 L8 5 L11 8 L8 11 Z\" fill=\"var(--osk-ink)\"><\u002Fpath>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"logo-text\">\n      <span class=\"logo-osk\">OSK<\u002Fspan>\n      <span class=\"logo-extreme\">Extreme<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"header\">\n    <div class=\"chapter-label\">Cegiełka 01<\u002Fdiv>\n    <h1 class=\"title\">Ustąpienie<br><em>pierwszeństwa<\u002Fem><\u002Fh1>\n    <p class=\"title-sub\">— co to naprawdę znaczy<\u002Fp>\n    <div class=\"blinker-deco\">\n      <span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"body\">\n\n    <!-- DEFINICJA -->\n    <div class=\"section\" style=\"padding-bottom: 0;\">\n      <div class=\"divider-label\">Definicja<\u002Fdiv>\n      <p class=\"lead\" style=\"font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.25; letter-spacing: -0.01em; margin-bottom: 18px;\">\n        Czym jest <em style=\"font-style: italic; color: var(--osk-amber);\">ustąpienie pierwszeństwa<\u002Fem>?\n      <\u002Fp>\n      <div class=\"definition\">\n        <div class=\"def-label\">Zasada<\u002Fdiv>\n        <p>Twój ruch nie może sprawić, żeby inny uczestnik drogi musiał zmienić <strong>prędkość<\u002Fstrong> albo <strong>kierunek jazdy<\u002Fstrong>.<\u002Fp>\n        <p style=\"margin-top: 14px;\">Czyli musi być całkowicie neutralny — pieszy czy kierowca powinien móc jechać albo iść dokładnie tak samo, <strong>jakby Ciebie tam w ogóle nie było<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- EXAMPLES HEADER -->\n    <div class=\"examples-header\">\n      <div class=\"eh-num\">7<\u002Fdiv>\n      <div class=\"eh-label\">Sytuacje na drodze<\u002Fdiv>\n      <div class=\"eh-rule\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- PRZYKŁAD 1 -->\n    <div class=\"section\">\n      <div class=\"example-num\">Przykład 01<\u002Fdiv>\n      <h2 class=\"example-title\">Pieszy wchodzi na przejście<\u002Fh2>\n      <p>Podjeżdżasz do przejścia i widzisz faceta, który jednoznacznie pokazuje, że chce przejść. Patrzy w stronę pasów, ciało skierowane w ich kierunku, powoli się do nich zbliża.<\u002Fp>\n      <p>W tym momencie Twój ruch musi być neutralny. Nie zatrzymujesz się gwałtownie tuż przed nim, bo wtedy zmuszasz go do czekania. Pokazujesz mu, że widzisz go i że się zatrzymasz — jesteś dla niego <em style=\"font-style: italic; color: var(--osk-amber);\">przewidywalny<\u002Fem>.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- PRZYKŁAD 2 -->\n    <div class=\"section\">\n      <div class=\"example-num\">Przykład 02<\u002Fdiv>\n      <h2 class=\"example-title\">Pieszy jest już na przejściu<\u002Fh2>\n      <p>Wyobraź sobie bardzo długie przejście dla pieszych. Pieszy wszedł na pasy od prawej strony i spokojnie idzie przed siebie. Ty stoisz na prawym pasie i czekasz.<\u002Fp>\n      <p>W pewnym momencie pieszy mija Twoją maskę, jest już po Twojej lewej stronie i powoli oddala się w kierunku lewej krawędzi.<\u002Fp>\n      <div class=\"question\">Czy możesz już ruszyć?<\u002Fdiv>\n      <div class=\"scenario\">\n        <div class=\"scenario-label\">To zależy od jednej rzeczy<\u002Fdiv>\n        <p>Czy Twój ruch będzie dla niego neutralny. Pieszy musi odejść na tyle daleko, żebyś jadąc za jego plecami go nie wystraszył — bo jeśli przez Twój ruch przyspieszy kroku, wpłynąłeś na jego ruch i warunki nie zostały spełnione.<\u002Fp>\n      <\u002Fdiv>\n      <p class=\"highlight\" style=\"margin-top: 20px;\">Nie musisz czekać, aż pieszy <em>opuści<\u002Fem> przejście.<\u002Fp>\n      <p style=\"margin-top: 12px; color: var(--osk-ink-mid); font-size: 13.5px;\">Nawet jeśli cały czas się na nim znajduje — jeśli Twój ruch w żaden sposób nie wpływa na jego tempo chodu, warunki ustąpienia pierwszeństwa są spełnione. Ruszasz.<\u002Fp>\n      <div class=\"effect\">\n        <div class=\"effect-mark\">\n          <svg viewBox=\"0 0 22 22\" fill=\"none\">\n            <circle cx=\"11\" cy=\"11\" r=\"9\" stroke=\"var(--osk-amber)\" stroke-width=\"1.5\"><\u002Fcircle>\n            <path d=\"M7 11.5 L10 14 L15.5 8\" stroke=\"var(--osk-amber)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div class=\"effect-label\">Efekt<\u002Fdiv>\n          <div class=\"effect-text\">Pieszy idzie swoim tempem. Ty przejeżdżasz za jego plecami i nie wpływasz na jego krok. Mimo że pieszy <em>cały czas<\u002Fem> jest na przejściu, warunki ustąpienia pierwszeństwa zostały spełnione.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- PRZYKŁAD 3 -->\n    <div class=\"section\">\n      <div class=\"example-num\">Przykład 03<\u002Fdiv>\n      <h2 class=\"example-title\">Wyjeżdżasz tyłem z parkingu<\u002Fh2>\n      <p>Stoisz tyłem do jezdni, chcesz wyjechać. Z prawej strony jedzie samochód. Oceniasz sytuację i widzisz, że jeśli ruszysz, zmusisz go do zmiany prędkości.<\u002Fp>\n      <div class=\"scenario\">\n        <div class=\"scenario-label\">Co robisz<\u002Fdiv>\n        <p>Powstrzymujesz się od ruchu — po prostu stoisz w miejscu i czekasz, aż kierowca przejedzie. Gdy już minie, raz jeszcze upewniasz się, że Twój ruch w żaden sposób nie wpłynie na innego uczestnika ruchu.<\u002Fp>\n        <p>I dopiero gdy masz pewność, że spełniasz warunki ustąpienia pierwszeństwa, wjeżdżasz na jezdnię.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"effect\">\n        <div class=\"effect-mark\">\n          <svg viewBox=\"0 0 22 22\" fill=\"none\">\n            <circle cx=\"11\" cy=\"11\" r=\"9\" stroke=\"var(--osk-amber)\" stroke-width=\"1.5\"><\u002Fcircle>\n            <path d=\"M7 11.5 L10 14 L15.5 8\" stroke=\"var(--osk-amber)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div class=\"effect-label\">Efekt<\u002Fdiv>\n          <div class=\"effect-text\">Tamten kierowca jedzie swoim tempem, jakby Cię w ogóle nie było. Warunki ustąpienia pierwszeństwa zostały spełnione.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- PRZYKŁAD 4 -->\n    <div class=\"section\">\n      <div class=\"example-num\">Przykład 04<\u002Fdiv>\n      <h2 class=\"example-title\">Ktoś pojawił się za Tobą<\u002Fh2>\n      <p>Oceniasz sytuację na jezdni — nikogo nie ma. Właśnie dlatego decydujesz się rozpocząć manewr. W trakcie wyjazdu orientujesz się, że za Tobą pojawił się samochód. Widzisz go w lusterku.<\u002Fp>\n      <div class=\"question\">Co robisz?<\u002Fdiv>\n      <div class=\"scenario\">\n        <div class=\"scenario-label\">Przestajesz się ruszać<\u002Fdiv>\n        <p>Stajesz w miejscu. Nie ma już żadnego ruchu z Twojej strony — jest <em style=\"font-style: italic; color: var(--osk-amber);\">nieruch<\u002Fem>.<\u002Fp>\n        <p>Owszem, tamten kierowca musi zwolnić, może nawet się zatrzymać, bo stoisz na jego pasie. Ale to nie Twój ruch zmusił go do zmiany prędkości.<\u002Fp>\n      <\u002Fdiv>\n      <p class=\"highlight\" style=\"margin-top: 20px;\">Warunki ustąpienia pierwszeństwa <em>zostały<\u002Fem> spełnione.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- PRZYKŁAD 5 -->\n    <div class=\"section\">\n      <div class=\"example-num\">Przykład 05<\u002Fdiv>\n      <h2 class=\"example-title\">Zmiana pasa ruchu<\u002Fh2>\n      <p>Jedziesz prawym pasem. Na najbliższym skrzyżowaniu planujesz skręcić w lewo. Żeby to zrobić, musisz zmienić pas na skrajnie lewy.<\u002Fp>\n      <p class=\"highlight\" style=\"margin-top: 16px;\">Zawsze na pierwszym miejscu jest <em>przekazanie intencji<\u002Fem>.<\u002Fp>\n      <p style=\"margin-top: 12px;\">Włączasz kierunkowskaz, a następnie kierujesz swoją uwagę na lusterko. W lusterku orientujesz się, że na pasie, na który zamierzasz wyjechać, znajduje się już pojazd, który przemieszcza się z większą prędkością niż Ty.<\u002Fp>\n      <div class=\"scenario\">\n        <div class=\"scenario-label\">Cierpliwie<\u002Fdiv>\n        <p>Kierunkowskaz cały czas pozostaje włączony, a Ty na przemian obserwujesz sytuację przed sobą i sytuację w lusterku. Widzisz, że pojazd cały czas trzyma swoje tempo.<\u002Fp>\n        <p>Jest jednoznaczne, że nie planuje Cię przepuścić, dlatego z włączonym kierunkowskazem cierpliwie czekasz, aż pojazd przejedzie dalej. Dopiero kiedy pojazd przejeżdża, Ty spokojnie zmieniasz pas ruchu.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"effect\">\n        <div class=\"effect-mark\">\n          <svg viewBox=\"0 0 22 22\" fill=\"none\">\n            <circle cx=\"11\" cy=\"11\" r=\"9\" stroke=\"var(--osk-amber)\" stroke-width=\"1.5\"><\u002Fcircle>\n            <path d=\"M7 11.5 L10 14 L15.5 8\" stroke=\"var(--osk-amber)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div class=\"effect-label\">Efekt<\u002Fdiv>\n          <div class=\"effect-text\">Kierunkowskaz był włączony od samego początku, ale swój ruch rozpocząłeś dopiero w momencie, kiedy miałeś pewność, że nie wpłynie on na innego uczestnika ruchu. Tamten kierowca jechał swoim tempem, nie musiał hamować ani niczego zmieniać.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- PRZYKŁAD 6 -->\n    <div class=\"section\">\n      <div class=\"example-num\">Przykład 06<\u002Fdiv>\n      <h2 class=\"example-title\">Włączanie się z pasa włączeniowego<\u002Fh2>\n      <p>Jedziesz pasem włączeniowym, który się kończy, i chcesz włączyć się do ruchu na główną jezdnię. Obok Ciebie na lewym pasie jadą pojazdy.<\u002Fp>\n      <div class=\"strip\">\n        <div class=\"strip-label\">Strategia jest odmienna<\u002Fdiv>\n        <div class=\"strip-text\">Zamiast czekać, aż sytuacja się wyczyści — wyrównujesz prędkość do pojazdów na drodze z pierwszeństwem.<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top: 18px;\">Kiedy już jedziesz dokładnie tym samym tempem co oni i Twój ruch jest całkowicie neutralny — płynnie, bez zmuszania kogokolwiek do hamowania czy przyspieszania, wsuwasz się między nich na lewy pas.<\u002Fp>\n      <div class=\"effect\">\n        <div class=\"effect-mark\">\n          <svg viewBox=\"0 0 22 22\" fill=\"none\">\n            <circle cx=\"11\" cy=\"11\" r=\"9\" stroke=\"var(--osk-amber)\" stroke-width=\"1.5\"><\u002Fcircle>\n            <path d=\"M7 11.5 L10 14 L15.5 8\" stroke=\"var(--osk-amber)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div class=\"effect-label\">Efekt<\u002Fdiv>\n          <div class=\"effect-text\">Pojazdy na drodze z pierwszeństwem nie muszą zmieniać prędkości. Ty wyrównałeś do ich tempa — i po prostu wsunąłeś się do ruchu.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- PRZYKŁAD 7 -->\n    <div class=\"section\">\n      <div class=\"example-num\">Przykład 07<\u002Fdiv>\n      <h2 class=\"example-title\">Skręt w prawo przed powoli jadącym skuterem<\u002Fh2>\n      <p>Podjeżdżasz do skrzyżowania i chcesz skręcić w prawo. Z lewej strony nadjeżdża skuter, ale jedzie powoli i jest jeszcze dość daleko.<\u002Fp>\n      <p>Oceniasz sytuację i widzisz, że jeśli płynnie skręcisz i przyspieszysz, to skuter w ogóle nie będzie musiał zmieniać swojej prędkości ani toru jazdy. On będzie jechał dokładnie tak samo, <em style=\"font-style: italic; color: var(--osk-amber);\">jakby Ciebie tam nie było<\u002Fem>.<\u002Fp>\n      <p style=\"margin-top: 12px;\">W takim momencie Twój ruch jest neutralny — nie zmuszasz skutera do żadnej reakcji, po prostu płynnie wjeżdżasz przed niego.<\u002Fp>\n      <div class=\"effect\">\n        <div class=\"effect-mark\">\n          <svg viewBox=\"0 0 22 22\" fill=\"none\">\n            <circle cx=\"11\" cy=\"11\" r=\"9\" stroke=\"var(--osk-amber)\" stroke-width=\"1.5\"><\u002Fcircle>\n            <path d=\"M7 11.5 L10 14 L15.5 8\" stroke=\"var(--osk-amber)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div>\n          <div class=\"effect-label\">Efekt<\u002Fdiv>\n          <div class=\"effect-text\">Wjechałeś przed pojazd, który znajdował się na drodze z pierwszeństwem. Mimo to spełniłeś warunki ustąpienia pierwszeństwa.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"progress\">Cegiełka 01 — koniec<\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div class=\"footer\">\n    <div class=\"footer-stack\">\n      <span class=\"footer-osk\">OSK<\u002Fspan>\n      <span class=\"footer-ext\">Extreme<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"footer-indicator\">\n      <div class=\"fi-arrow dim\"><\u002Fdiv>\n      <div class=\"fi-arrow dim\"><\u002Fdiv>\n      <div class=\"fi-arrow\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
