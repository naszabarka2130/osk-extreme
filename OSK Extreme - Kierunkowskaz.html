document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 900;\n  font-display: swap;\n  src: url(\"7f55ea9d-47b1-42b6-8d3f-fed2619e6b55\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n\n<style>\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --cream:    oklch(96.5% 0.012 78);\n    --paper:    oklch(93.5% 0.015 75);\n    --ink:      oklch(19% 0.018 55);\n    --ink-mid:  oklch(38% 0.016 55);\n    --ink-soft: oklch(58% 0.013 55);\n    --amber:    oklch(68% 0.17 58);\n    --amber-bg: oklch(93% 0.04 70);\n  }\n\n  body {\n    background: #d4cfc8;\n    display: flex;\n    justify-content: center;\n    align-items: flex-start;\n    padding: 32px 16px 48px;\n    min-height: 100vh;\n    font-family: 'Lora', Georgia, serif;\n  }\n\n  .card {\n    width: 390px;\n    background: var(--cream);\n    color: var(--ink);\n    position: relative;\n    overflow: hidden;\n  }\n\n  /* top bar */\n  .top-bar {\n    background: var(--ink);\n    height: 5px;\n    width: 100%;\n  }\n\n  .header {\n    padding: 36px 32px 28px;\n    border-bottom: 1px solid var(--paper);\n    position: relative;\n  }\n\n  .chapter-label {\n    font-family: 'Lora', serif;\n    font-size: 11px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--amber);\n    font-weight: 500;\n    margin-bottom: 14px;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n  }\n\n  .chapter-label::before {\n    content: '';\n    display: inline-block;\n    width: 20px;\n    height: 2px;\n    background: var(--amber);\n  }\n\n  .title {\n    font-family: 'Playfair Display', Georgia, serif;\n    font-size: 32px;\n    font-weight: 900;\n    line-height: 1.1;\n    letter-spacing: -0.02em;\n    color: var(--ink);\n  }\n\n  .title em {\n    font-style: italic;\n    color: var(--amber);\n  }\n\n  /* blinker icon decoration */\n  .blinker-deco {\n    position: absolute;\n    top: 32px;\n    right: 28px;\n    display: flex;\n    gap: 4px;\n    opacity: 0.2;\n  }\n\n  .blinker-deco span {\n    display: block;\n    width: 8px;\n    height: 8px;\n    background: var(--amber);\n    clip-path: polygon(0 50%, 40% 0, 100% 0, 100% 100%, 40% 100%);\n  }\n\n  .blinker-deco span:nth-child(1) { opacity: 0.4; }\n  .blinker-deco span:nth-child(2) { opacity: 0.7; }\n  .blinker-deco span:nth-child(3) { opacity: 1; }\n\n  /* body sections */\n  .body {\n    padding: 0 32px 36px;\n  }\n\n  .section {\n    padding: 24px 0;\n    border-bottom: 1px solid var(--paper);\n  }\n\n  .section:last-child {\n    border-bottom: none;\n  }\n\n  p {\n    font-size: 14.5px;\n    line-height: 1.72;\n    color: var(--ink);\n    text-wrap: pretty;\n  }\n\n  p + p {\n    margin-top: 12px;\n  }\n\n  /* lead paragraph */\n  .lead {\n    font-size: 15.5px;\n    line-height: 1.68;\n    color: var(--ink);\n  }\n\n  /* signals list */\n  .signals-intro {\n    font-size: 14px;\n    color: var(--ink-mid);\n    line-height: 1.65;\n    margin-bottom: 16px;\n    text-wrap: pretty;\n  }\n\n  .signal-list {\n    list-style: none;\n    display: flex;\n    flex-direction: column;\n    gap: 10px;\n  }\n\n  .signal-item {\n    display: grid;\n    grid-template-columns: 24px 1fr;\n    gap: 10px;\n    align-items: start;\n    background: var(--amber-bg);\n    border-radius: 2px;\n    padding: 12px 14px;\n  }\n\n  .signal-icon {\n    width: 20px;\n    height: 20px;\n    margin-top: 1px;\n    flex-shrink: 0;\n  }\n\n  .signal-text {\n    font-size: 13.5px;\n    line-height: 1.6;\n    color: var(--ink);\n  }\n\n  .signal-text .action {\n    font-weight: 500;\n    display: block;\n    color: var(--ink);\n    margin-bottom: 2px;\n  }\n\n  .signal-text .meaning {\n    font-style: italic;\n    color: var(--ink-mid);\n    font-size: 13px;\n  }\n\n  /* pull quote */\n  .pull-quote {\n    background: var(--ink);\n    color: var(--cream);\n    padding: 24px 26px;\n    margin: 0 -32px;\n    position: relative;\n  }\n\n  .pull-quote::before {\n    content: '→';\n    font-size: 28px;\n    color: var(--amber);\n    display: block;\n    margin-bottom: 10px;\n    line-height: 1;\n  }\n\n  .pull-quote p {\n    color: var(--cream);\n    font-size: 15px;\n    line-height: 1.65;\n    font-style: italic;\n  }\n\n  .pull-quote strong {\n    font-style: normal;\n    color: var(--amber);\n  }\n\n  /* scenario block */\n  .scenario {\n    background: var(--paper);\n    border-left: 3px solid var(--amber);\n    padding: 18px 18px 18px 20px;\n    margin-top: 20px;\n  }\n\n  .scenario-label {\n    font-size: 10px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--amber);\n    font-weight: 600;\n    margin-bottom: 10px;\n  }\n\n  .scenario p {\n    font-size: 13.5px;\n    line-height: 1.68;\n    color: var(--ink-mid);\n  }\n\n  /* section divider label */\n  .divider-label {\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n    margin-bottom: 14px;\n  }\n\n  /* highlight sentence */\n  .highlight {\n    font-size: 17px;\n    line-height: 1.5;\n    font-family: 'Playfair Display', serif;\n    font-weight: 700;\n    color: var(--ink);\n    text-wrap: pretty;\n  }\n\n  /* logo */\n  .logo-bar {\n    padding: 20px 32px 16px;\n    display: flex;\n    align-items: center;\n    gap: 10px;\n  }\n\n  .logo-mark {\n    width: 30px;\n    height: 30px;\n    background: var(--ink);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n  }\n\n  .logo-mark svg {\n    width: 16px;\n    height: 16px;\n  }\n\n  .logo-text {\n    display: flex;\n    flex-direction: column;\n    line-height: 1;\n    gap: 2px;\n  }\n\n  .logo-osk {\n    font-family: 'Lora', serif;\n    font-size: 9px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n    font-weight: 500;\n  }\n\n  .logo-extreme {\n    font-family: 'Playfair Display', serif;\n    font-size: 15px;\n    font-weight: 900;\n    letter-spacing: 0.04em;\n    text-transform: uppercase;\n    color: var(--ink);\n  }\n\n  /* footer */\n  .footer {\n    background: var(--paper);\n    padding: 18px 32px;\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    border-top: 2px solid var(--amber);\n  }\n\n  .footer-indicator {\n    display: flex;\n    gap: 3px;\n  }\n\n  .fi-arrow {\n    width: 9px;\n    height: 9px;\n    background: var(--amber);\n    clip-path: polygon(0 50%, 35% 0, 100% 0, 100% 100%, 35% 100%);\n  }\n\n  .fi-arrow.dim { opacity: 0.3; }\n\n  .footer-text {\n    font-size: 11px;\n    color: var(--ink-soft);\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"card\">\n  <div class=\"top-bar\"><\u002Fdiv>\n\n  <div class=\"logo-bar\">\n    <div class=\"logo-mark\">\n      <svg viewBox=\"0 0 16 16\" fill=\"none\">\n        <path d=\"M2 8 L8 2 L14 8 L8 14 Z\" fill=\"var(--amber)\"><\u002Fpath>\n        <path d=\"M5 8 L8 5 L11 8 L8 11 Z\" fill=\"var(--ink)\"><\u002Fpath>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"logo-text\">\n      <span class=\"logo-osk\">OSK<\u002Fspan>\n      <span class=\"logo-extreme\">Extreme<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"header\">\n    <div class=\"chapter-label\">Rozdział 0<\u002Fdiv>\n    <h1 class=\"title\">Czym jest<br><em>kierunkowskaz<\u002Fem><\u002Fh1>\n    <div class=\"blinker-deco\">\n      <span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"body\">\n\n    <div class=\"section\">\n      <p class=\"lead\">Ruch drogowy działa sprawnie dlatego, że wszyscy jego uczestnicy poruszają się według tych samych zasad. Uczymy się tej samej logiki, stosujemy te same schematy — i dzięki temu możemy na siebie nawzajem liczyć.<\u002Fp>\n      <p style=\"margin-top:12px; color: var(--ink-mid); font-size:14px;\">Wiemy, czego się spodziewać po innych, a inni wiedzą, czego spodziewać się po nas.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"section\">\n      <div class=\"divider-label\">Sygnały na drodze<\u002Fdiv>\n      <p class=\"signals-intro\">Samo stosowanie przepisów to nie wszystko. Żeby być naprawdę czytelnym uczestnikiem ruchu, warto korzystać z całego zestawu sygnałów, które masz do dyspozycji:<\u002Fp>\n      <ul class=\"signal-list\">\n        <li class=\"signal-item\">\n          <svg class=\"signal-icon\" viewBox=\"0 0 20 20\" fill=\"none\">\n            <circle cx=\"10\" cy=\"10\" r=\"7\" stroke=\"var(--amber)\" stroke-width=\"1.5\"><\u002Fcircle>\n            <path d=\"M7 10 L10 7 L13 10\" stroke=\"var(--amber)\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n            <line x1=\"10\" y1=\"7\" x2=\"10\" y2=\"13\" stroke=\"var(--amber)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fline>\n          <\u002Fsvg>\n          <div class=\"signal-text\">\n            <span class=\"action\">Mrugasz światłami drogowymi<\u002Fspan>\n            <span class=\"meaning\">\"Hej, śmiało, wpuszczam cię!\"<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li class=\"signal-item\">\n          <svg class=\"signal-icon\" viewBox=\"0 0 20 20\" fill=\"none\">\n            <path d=\"M5 5 L15 15 M15 5 L5 15\" stroke=\"var(--amber)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath>\n            <circle cx=\"10\" cy=\"10\" r=\"7\" stroke=\"var(--amber)\" stroke-width=\"1.5\" opacity=\"0.4\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div class=\"signal-text\">\n            <span class=\"action\">Włączasz awaryjne<\u002Fspan>\n            <span class=\"meaning\">\"Dzięki, że mnie przepuściłeś!\"<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li class=\"signal-item\">\n          <svg class=\"signal-icon\" viewBox=\"0 0 20 20\" fill=\"none\">\n            <rect x=\"3\" y=\"13\" width=\"14\" height=\"3\" rx=\"1\" fill=\"var(--amber)\" opacity=\"0.3\"><\u002Frect>\n            <path d=\"M3 13 Q10 6 17 13\" stroke=\"var(--amber)\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n            <circle cx=\"10\" cy=\"11\" r=\"1.5\" fill=\"var(--amber)\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div class=\"signal-text\">\n            <span class=\"action\">Hamuje wcześniej niż musisz<\u002Fspan>\n            <span class=\"meaning\">\"Uwaga, zaczynam hamować — przygotuj się!\"<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fli>\n      <\u002Ful>\n      <p style=\"margin-top:16px; font-size:13px; color:var(--ink-soft);\">To wszystko są sposoby komunikacji. Nieformalne, ale powszechnie rozumiane.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"section\" style=\"padding-bottom: 0;\">\n      <div class=\"pull-quote\">\n        <p>Kierunkowskaz jest narzędziem do przekazywania <strong>intencji<\u002Fstrong>. Nie informuje o tym, co się właśnie dzieje — informuje o tym, <strong>co zamierzasz zrobić<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"section\">\n      <div class=\"divider-label\">Przykład<\u002Fdiv>\n      <p style=\"font-size:14px; color: var(--ink-mid);\">Skręcasz w prawo. W tym samym momencie ta jedna informacja trafia do kilku osób naraz.<\u002Fp>\n      <div class=\"scenario\">\n        <div class=\"scenario-label\">Co się dzieje<\u002Fdiv>\n        <p>Kierowca za tobą wie, że zaraz zwolnisz — i wie dlaczego. Nie musi się domyślać, nie jest zaskoczony. Może spokojnie dostosować prędkość.<\u002Fp>\n        <p style=\"margin-top: 10px;\">Przy wyjeździe z bocznej drogi czeka kierowca, który chce włączyć się do ruchu. Widzi twój prawy kierunkowskaz i wie, że za chwilę zwolnisz i zjedziesz z jego drogi.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin-top: 16px; font-size: 13.5px; color: var(--ink-mid);\">Jedna prosta czynność — wciśnięcie dźwigni — i kilka osób naraz dostaje informację, której potrzebuje, żeby podjąć właściwą decyzję.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"section\">\n      <p class=\"highlight\">Kierowca, który włącza kierunkowskaz <em style=\"font-style:italic;\">w trakcie<\u002Fem> manewru, równie dobrze mógłby go nie włączać.<\u002Fp>\n      <p style=\"margin-top: 14px; font-size: 13.5px; color: var(--ink-mid);\">Wszyscy już widzą, że skręca — kierunkowskaz nie dodaje żadnej nowej informacji.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"section\" style=\"border-bottom: none; padding-bottom: 0;\">\n      <p style=\"font-size:14px; line-height:1.68; color:var(--ink);\">Jako kierowca chcesz być częścią tego systemu — przewidywalną, czytelną jego częścią. Nie chcesz być zaskoczeniem dla innych.<\u002Fp>\n      <p style=\"margin-top: 10px; font-size: 13.5px; color: var(--ink-mid);\">Kierunkowskaz to najprostsze narzędzie, jakie masz, żeby powiedzieć innym: <em>\"zaraz przestanę jechać prosto. Planuję skręcić w prawo.\"<\u002Fem><\u002Fp>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div class=\"footer\">\n    <div style=\"display:flex; flex-direction:column; gap:2px;\">\n      <span style=\"font-family:'Lora',serif; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-soft);\">OSK<\u002Fspan>\n      <span style=\"font-family:'Playfair Display',serif; font-size:17px; font-weight:900; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink); line-height:1;\">Extreme<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto; display:flex; gap:3px; align-items:center;\">\n      <div class=\"fi-arrow dim\"><\u002Fdiv>\n      <div class=\"fi-arrow dim\"><\u002Fdiv>\n      <div class=\"fi-arrow\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
