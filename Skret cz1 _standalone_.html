  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"26f3e145-e4f3-4c77-a218-d770247a9c4f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"62d1214a-395e-472f-b097-3468d0cc2565\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n  :root {\n    --cream:    #f5f0e8;\n    --paper:    #e8e0d0;\n    --letter:   #d4cfc8;\n    --ink:      #2a2520;\n    --ink-mid:  #5a5048;\n    --ink-soft: #8a7e72;\n    --amber:    #c47a2a;\n    --amber-bg: #f0e3cf;\n    --amber-deep: #a85f1a;\n  }\n\n  html, body { background: var(--letter); }\n\n  body {\n    display: flex;\n    justify-content: center;\n    align-items: flex-start;\n    padding: 32px 16px 48px;\n    min-height: 100vh;\n    font-family: 'Lora', Georgia, serif;\n    color: var(--ink);\n    -webkit-font-smoothing: antialiased;\n  }\n\n  .card {\n    width: 390px;\n    background: var(--cream);\n    color: var(--ink);\n    position: relative;\n    overflow: hidden;\n  }\n\n  /* top bar */\n  .top-bar {\n    background: var(--ink);\n    height: 5px;\n    width: 100%;\n  }\n\n  /* logo bar */\n  .logo-bar {\n    padding: 20px 32px 16px;\n    display: flex;\n    align-items: center;\n    gap: 10px;\n  }\n\n  .logo-mark {\n    width: 30px;\n    height: 30px;\n    background: var(--ink);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n  }\n\n  .logo-mark svg { width: 16px; height: 16px; }\n\n  .logo-text {\n    display: flex;\n    flex-direction: column;\n    line-height: 1;\n    gap: 2px;\n  }\n\n  .logo-osk {\n    font-family: 'Lora', serif;\n    font-size: 9px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n    font-weight: 500;\n  }\n\n  .logo-extreme {\n    font-family: 'Playfair Display', serif;\n    font-size: 15px;\n    font-weight: 900;\n    letter-spacing: 0.04em;\n    text-transform: uppercase;\n    color: var(--ink);\n  }\n\n  .logo-spacer { flex: 1; }\n\n  .reading-meta {\n    font-size: 10px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n    font-weight: 500;\n  }\n\n  /* header */\n  .header {\n    padding: 28px 32px 32px;\n    border-bottom: 1px solid var(--paper);\n    position: relative;\n  }\n\n  .chapter-label {\n    font-family: 'Lora', serif;\n    font-size: 11px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--amber);\n    font-weight: 500;\n    margin-bottom: 16px;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n  }\n\n  .chapter-label::before {\n    content: '';\n    display: inline-block;\n    width: 20px;\n    height: 2px;\n    background: var(--amber);\n  }\n\n  .title {\n    font-family: 'Playfair Display', Georgia, serif;\n    font-size: 30px;\n    font-weight: 900;\n    line-height: 1.12;\n    letter-spacing: -0.02em;\n    color: var(--ink);\n    text-wrap: balance;\n  }\n\n  .title em {\n    font-style: italic;\n    color: var(--amber);\n    font-weight: 700;\n  }\n\n  .subtitle {\n    margin-top: 16px;\n    font-family: 'Lora', serif;\n    font-style: italic;\n    font-size: 13.5px;\n    line-height: 1.55;\n    color: var(--ink-mid);\n    text-wrap: pretty;\n  }\n\n  /* blinker decoration top right of header */\n  .blinker-deco {\n    position: absolute;\n    top: 28px;\n    right: 28px;\n    display: flex;\n    gap: 4px;\n    opacity: 0.25;\n  }\n\n  .blinker-deco span {\n    display: block;\n    width: 9px;\n    height: 9px;\n    background: var(--amber);\n    clip-path: polygon(0 50%, 40% 0, 100% 0, 100% 100%, 40% 100%);\n  }\n\n  .blinker-deco span:nth-child(1) { opacity: 0.4; }\n  .blinker-deco span:nth-child(2) { opacity: 0.7; }\n  .blinker-deco span:nth-child(3) { opacity: 1; }\n\n  /* body */\n  .body {\n    padding: 0 32px 36px;\n  }\n\n  .section {\n    padding: 26px 0;\n    border-bottom: 1px solid var(--paper);\n  }\n  .section:last-child { border-bottom: none; }\n\n  p {\n    font-size: 14.5px;\n    line-height: 1.78;\n    color: var(--ink);\n    text-wrap: pretty;\n  }\n\n  p + p { margin-top: 14px; }\n\n  p em { font-style: italic; }\n  p strong {\n    font-weight: 700;\n    color: var(--ink);\n  }\n\n  /* lead paragraph */\n  .lead {\n    font-size: 16px;\n    line-height: 1.7;\n    color: var(--ink);\n  }\n\n  /* h2 */\n  h2 {\n    font-family: 'Playfair Display', Georgia, serif;\n    font-size: 22px;\n    font-weight: 700;\n    line-height: 1.22;\n    letter-spacing: -0.01em;\n    color: var(--ink);\n    margin-bottom: 14px;\n    text-wrap: balance;\n  }\n\n  h2 em {\n    font-style: italic;\n    color: var(--amber);\n  }\n\n  .section-eyebrow {\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--amber);\n    font-weight: 600;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n  }\n\n  .section-eyebrow::before {\n    content: '';\n    display: inline-block;\n    width: 14px;\n    height: 1.5px;\n    background: var(--amber);\n  }\n\n  /* italic inner-monologue paragraph */\n  .quoted {\n    font-style: italic;\n    color: var(--ink-mid);\n    padding: 4px 0 4px 14px;\n    border-left: 2px solid var(--amber);\n    margin: 14px 0;\n    font-size: 14px;\n    line-height: 1.65;\n  }\n\n  /* pull quote */\n  .pull-quote {\n    background: var(--ink);\n    color: var(--cream);\n    padding: 26px 28px;\n    margin: 26px -32px;\n    position: relative;\n  }\n\n  .pull-quote::before {\n    content: '→';\n    font-family: 'Lora', serif;\n    font-size: 28px;\n    color: var(--amber);\n    display: block;\n    margin-bottom: 10px;\n    line-height: 1;\n  }\n\n  .pull-quote p {\n    color: var(--cream);\n    font-size: 15.5px;\n    line-height: 1.6;\n    font-style: italic;\n  }\n\n  .pull-quote strong {\n    font-style: normal;\n    color: var(--amber);\n    font-weight: 700;\n  }\n\n  /* highlight (Playfair) */\n  .highlight {\n    font-family: 'Playfair Display', serif;\n    font-weight: 700;\n    font-size: 19px;\n    line-height: 1.4;\n    color: var(--ink);\n    text-wrap: balance;\n    letter-spacing: -0.005em;\n  }\n\n  .highlight em {\n    font-style: italic;\n    color: var(--amber);\n  }\n\n  /* rule pair (the two rules block) */\n  .rules {\n    display: flex;\n    flex-direction: column;\n    gap: 14px;\n    margin: 18px 0 6px;\n  }\n\n  .rule {\n    background: var(--paper);\n    border-left: 3px solid var(--amber);\n    padding: 16px 18px;\n    display: grid;\n    grid-template-columns: 28px 1fr;\n    gap: 14px;\n    align-items: start;\n  }\n\n  .rule-glyph {\n    width: 28px;\n    height: 28px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    margin-top: 1px;\n  }\n\n  .rule-glyph svg { width: 26px; height: 26px; }\n\n  .rule-text {\n    font-size: 13.5px;\n    line-height: 1.55;\n    color: var(--ink);\n  }\n\n  .rule-text .rule-head {\n    display: block;\n    font-family: 'Playfair Display', serif;\n    font-weight: 700;\n    font-size: 14.5px;\n    letter-spacing: 0;\n    margin-bottom: 4px;\n    color: var(--ink);\n  }\n\n  .rule-text .rule-head em {\n    font-style: italic;\n    color: var(--amber);\n  }\n\n  .rule-text .rule-body {\n    color: var(--ink-mid);\n    font-size: 13px;\n    line-height: 1.6;\n  }\n\n  /* numbered list (three reasons) */\n  .reasons {\n    list-style: none;\n    counter-reset: reason;\n    display: flex;\n    flex-direction: column;\n    gap: 18px;\n    margin-top: 18px;\n  }\n\n  .reasons li {\n    counter-increment: reason;\n    display: grid;\n    grid-template-columns: 36px 1fr;\n    gap: 14px;\n    align-items: start;\n  }\n\n  .reasons li::before {\n    content: counter(reason, decimal-leading-zero);\n    font-family: 'Playfair Display', serif;\n    font-weight: 900;\n    font-style: italic;\n    font-size: 24px;\n    color: var(--amber);\n    line-height: 1;\n    padding-top: 2px;\n  }\n\n  .reasons li p {\n    font-size: 14px;\n    line-height: 1.7;\n    color: var(--ink);\n  }\n\n  .reasons li p strong {\n    font-weight: 700;\n  }\n\n  .reasons li p + p {\n    margin-top: 8px;\n    color: var(--ink-mid);\n    font-size: 13.5px;\n  }\n\n  /* scenario block */\n  .scenario {\n    background: var(--paper);\n    border-left: 3px solid var(--amber);\n    padding: 18px 20px;\n    margin: 18px 0 6px;\n  }\n\n  .scenario-label {\n    font-size: 10px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--amber);\n    font-weight: 600;\n    margin-bottom: 10px;\n  }\n\n  .scenario p {\n    font-size: 13.5px;\n    line-height: 1.7;\n    color: var(--ink-mid);\n  }\n\n  .scenario p em {\n    color: var(--ink);\n  }\n\n  /* mirror diagram — vertical stack of three states */\n  .mirror-fig {\n    margin: 24px -8px 10px;\n    padding: 22px 18px 20px;\n    background: var(--paper);\n  }\n\n  .mirror-fig-title {\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n    text-align: center;\n    font-weight: 500;\n    margin-bottom: 18px;\n    padding-bottom: 10px;\n    border-bottom: 1px solid var(--cream);\n  }\n\n  .mirror-stack {\n    display: flex;\n    flex-direction: column;\n    gap: 18px;\n  }\n\n  .mirror-row {\n    display: grid;\n    grid-template-columns: 90px 1fr;\n    gap: 16px;\n    align-items: center;\n  }\n\n  .mirror-row svg {\n    width: 90px;\n    height: auto;\n    display: block;\n  }\n\n  .mirror-meta {\n    display: flex;\n    flex-direction: column;\n    gap: 4px;\n  }\n\n  .mirror-verdict {\n    font-family: 'Playfair Display', serif;\n    font-size: 16px;\n    font-weight: 700;\n    line-height: 1.15;\n  }\n\n  .mirror-verdict em {\n    font-style: italic;\n    color: var(--amber);\n  }\n\n  .mirror-row.bad .mirror-verdict { color: var(--ink-mid); }\n  .mirror-row.good .mirror-verdict { color: var(--ink); }\n\n  .mirror-sub {\n    font-family: 'Lora', serif;\n    font-size: 12.5px;\n    line-height: 1.5;\n    color: var(--ink-mid);\n  }\n\n  .mirror-row.good .mirror-sub { color: var(--ink); }\n\n  .mirror-tag {\n    font-size: 9px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    font-weight: 600;\n    margin-bottom: 2px;\n  }\n\n  .mirror-row.bad .mirror-tag { color: var(--ink-soft); }\n  .mirror-row.good .mirror-tag { color: var(--amber); }\n\n  /* takeaway block */\n  .takeaway {\n    background: var(--ink);\n    color: var(--cream);\n    padding: 24px 26px 26px;\n    margin: 24px -32px 0;\n  }\n\n  .takeaway-label {\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--amber);\n    font-weight: 600;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n  }\n\n  .takeaway-label::before {\n    content: '';\n    width: 14px; height: 1.5px;\n    background: var(--amber);\n    display: inline-block;\n  }\n\n  .takeaway p {\n    color: var(--cream);\n    font-family: 'Playfair Display', serif;\n    font-weight: 700;\n    font-size: 18px;\n    line-height: 1.4;\n    text-wrap: balance;\n  }\n\n  .takeaway p em {\n    font-style: italic;\n    color: var(--amber);\n  }\n\n  .takeaway .small {\n    margin-top: 12px;\n    font-family: 'Lora', serif;\n    font-weight: 400;\n    font-style: italic;\n    color: #c8bfb1;\n    font-size: 13.5px;\n    line-height: 1.6;\n  }\n\n  /* drop cap on first paragraph */\n  .dropcap::first-letter {\n    font-family: 'Playfair Display', serif;\n    font-weight: 900;\n    font-size: 52px;\n    line-height: 0.9;\n    color: var(--amber);\n    float: left;\n    padding: 6px 8px 0 0;\n    margin-top: 2px;\n  }\n\n  /* footer */\n  .footer {\n    background: var(--paper);\n    padding: 18px 32px;\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    border-top: 2px solid var(--amber);\n  }\n\n  .footer-text {\n    font-size: 11px;\n    color: var(--ink-soft);\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n  }\n\n  .fi-arrow {\n    width: 9px;\n    height: 9px;\n    background: var(--amber);\n    clip-path: polygon(0 50%, 35% 0, 100% 0, 100% 100%, 35% 100%);\n  }\n\n  .fi-arrow.dim { opacity: 0.3; }\n\n  .footer-meta {\n    margin-top: 6px;\n    padding: 14px 32px 28px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    font-size: 10.5px;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--ink-soft);\n  }\n\n  .footer-meta .next {\n    color: var(--amber);\n    font-weight: 500;\n  }\n\n  /* divider star */\n  .ornament {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 12px;\n    padding: 8px 0;\n  }\n\n  .ornament .dot {\n    width: 4px; height: 4px;\n    background: var(--amber);\n    border-radius: 50%;\n    opacity: 0.6;\n  }\n\n  .ornament .line {\n    flex: 0 0 40px;\n    height: 1px;\n    background: var(--amber);\n    opacity: 0.4;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"card\">\n  <div class=\"top-bar\"><\u002Fdiv>\n\n  <div class=\"logo-bar\">\n    <div class=\"logo-mark\">\n      <svg viewBox=\"0 0 16 16\" fill=\"none\">\n        <path d=\"M2 8 L8 2 L14 8 L8 14 Z\" fill=\"#c47a2a\"><\u002Fpath>\n        <path d=\"M5 8 L8 5 L11 8 L8 11 Z\" fill=\"#2a2520\"><\u002Fpath>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"logo-text\">\n      <span class=\"logo-osk\">OSK<\u002Fspan>\n      <span class=\"logo-extreme\">Extreme<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"logo-spacer\"><\u002Fdiv>\n    <span class=\"reading-meta\">8 min<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"header\">\n    <div class=\"chapter-label\">Skręt — część 1<\u002Fdiv>\n    <h1 class=\"title\">Wszyscy wiedzą, że <em>skręcasz<\u002Fem> — zanim ty skręcisz<\u002Fh1>\n    <p class=\"subtitle\">Ustawienie przed skrętem, część 1 — skręt zaczyna się wcześniej, niż myślisz.<\u002Fp>\n    <div class=\"blinker-deco\">\n      <span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"body\">\n\n    <!-- intro -->\n    <div class=\"section\">\n      <p class=\"lead dropcap\">Większość początkujących kierowców traktuje skręt mniej więcej tak:<\u002Fp>\n\n      <div class=\"quoted\">„Dojechałem do skrzyżowania, kręcę kierownicą, jadę w tę nową stronę.\"<\u002Fdiv>\n\n      <p>Logiczne. Klarowne. I — niestety — błędne.<\u002Fp>\n\n      <p>Dlatego, że skręt <strong>nie zaczyna się w momencie<\u002Fstrong>, w którym kręcisz kierownicą. Skręt zaczyna się dużo wcześniej — w chwili, gdy zaczynasz <strong>zajmować pozycję<\u002Fstrong>, z której zaraz skręcisz.<\u002Fp>\n\n      <p>I gdy ja siedzę za tobą w innym aucie i patrzę na ciebie, widzę twój skręt na długo przed tym, zanim ty czujesz, że go robisz. Widzę go, bo widzę, jak twoje auto delikatnie przesuwa się w prawo. Widzę go, bo widzę, że zwalniasz. Widzę go, bo masz włączony kierunkowskaz.<\u002Fp>\n\n      <div class=\"pull-quote\">\n        <p>W momencie, w którym faktycznie kręcisz kierownicą, <strong>wszystko już zostało powiedziane<\u002Fstrong>. Sam ruch kierownicy to tylko ostatnia sylaba zdania, które mówiłeś od pół minuty.<\u002Fp>\n      <\u002Fdiv>\n\n      <p>I to jest dokładnie temat tego tekstu.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- two rules -->\n    <div class=\"section\">\n      <div class=\"section-eyebrow\">§ 01 — Fundament<\u002Fdiv>\n      <h2>Dwie zasady, które trzeba sobie <em>wbić<\u002Fem><\u002Fh2>\n      <p>Zacznijmy od fundamentu. Masz mieć w głowie dwie krótkie reguły, które obowiązują <strong>zawsze<\u002Fstrong>:<\u002Fp>\n\n      <div class=\"rules\">\n        <div class=\"rule\">\n          <div class=\"rule-glyph\">\n            <svg viewBox=\"0 0 26 26\" fill=\"none\">\n              <line x1=\"4\" y1=\"4\" x2=\"4\" y2=\"22\" stroke=\"#c47a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fline>\n              <line x1=\"4\" y1=\"13\" x2=\"18\" y2=\"13\" stroke=\"#c47a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fline>\n              <path d=\"M14 8 L19 13 L14 18\" stroke=\"#c47a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n              <line x1=\"22\" y1=\"4\" x2=\"22\" y2=\"22\" stroke=\"#c47a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"0.3\"><\u002Fline>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"rule-text\">\n            <span class=\"rule-head\">Skręt w <em>prawo<\u002Fem><\u002Fspan>\n            <span class=\"rule-body\">Zbliżasz się do prawej krawędzi jezdni.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"rule\">\n          <div class=\"rule-glyph\">\n            <svg viewBox=\"0 0 26 26\" fill=\"none\">\n              <line x1=\"22\" y1=\"4\" x2=\"22\" y2=\"22\" stroke=\"#c47a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fline>\n              <line x1=\"22\" y1=\"13\" x2=\"8\" y2=\"13\" stroke=\"#c47a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fline>\n              <path d=\"M12 8 L7 13 L12 18\" stroke=\"#c47a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n              <line x1=\"4\" y1=\"4\" x2=\"4\" y2=\"22\" stroke=\"#c47a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-dasharray=\"2 3\" opacity=\"0.6\"><\u002Fline>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"rule-text\">\n            <span class=\"rule-head\">Skręt w <em>lewo<\u002Fem><\u002Fspan>\n            <span class=\"rule-body\">Zbliżasz się do osi jezdni (na drodze dwukierunkowej — czyli w 90% przypadków, w których będziesz się poruszać).<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin-top:20px;\">Tyle. To jest cała treść artykułu 22 Prawa o Ruchu Drogowym, sprowadzona do dwóch zdań.<\u002Fp>\n\n      <p>Ale tu nie chodzi o to, żebyś jechał pół centymetra od krawężnika albo od linii osi. Chodzi o to, żebyś <strong>wyraźnie zamarkował<\u002Fstrong> to zbliżenie. Żeby było widać. Żeby ja, jadący za tobą — rowerzysta dopędzający cię z prawej, kierowca z naprzeciwka oceniający, czy zdąży skręcić — żebym widział: <em>„aha, ten się przygotowuje\".<\u002Fem><\u002Fp>\n\n      <p>I właśnie tu zaczyna się naprawdę ciekawa rzecz.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- second signal -->\n    <div class=\"section\">\n      <div class=\"section-eyebrow\">§ 02 — Sygnał<\u002Fdiv>\n      <h2>Pozycja to nie kosmetyka. Pozycja to <em>drugi kierunkowskaz<\u002Fem>.<\u002Fh2>\n\n      <p>Wielu początkujących traktuje pozycję na jezdni jak coś dekoracyjnego. Coś, co ładnie wygląda na egzaminie, ale w realnym świecie nie ma znaczenia.<\u002Fp>\n\n      <p>To jest błąd. Pozycja jest jednym z <strong>najmocniejszych<\u002Fstrong> sygnałów, jakie wysyłasz na drogę. Czasem mocniejszym niż sam kierunkowskaz.<\u002Fp>\n\n      <p>Pomyśl tak: kierunkowskaz to <strong>pomarańczowa lampka<\u002Fstrong>, która migocze. Mała. Czasem niewidoczna pod słońce. Ktoś, kto spojrzał akurat w niewłaściwym ułamku sekundy, mógł jej w ogóle nie zauważyć.<\u002Fp>\n\n      <p>Pozycja auta to <strong>półtora tony blachy, która wyraźnie wędruje w prawo<\u002Fstrong>. Tego nie da się przeoczyć.<\u002Fp>\n\n      <p>Razem te dwa sygnały tworzą zdanie, które brzmi naprawdę wyraźnie: <em>„zaraz skręcę w prawo\".<\u002Fem> Każdy z osobna jest mocny. Razem są niepodważalne.<\u002Fp>\n\n      <p>I tu wchodzi rzecz, której prawie nikt początkującym nie nazywa po imieniu:<\u002Fp>\n\n      <p class=\"highlight\" style=\"margin-top:14px;\">Pozycja jest sygnałem, którego nie da się <em>wyłączyć<\u002Fem>.<\u002Fp>\n\n      <p style=\"margin-top:14px;\">Kierunkowskaz możesz włączyć albo nie. Możesz zapomnieć. Możesz nacisnąć go w ostatniej chwili. Pozycja działa inaczej — <strong>zawsze jakąś masz<\u002Fstrong>. Albo jesteś bliżej krawędzi, albo bliżej środka, albo gdzieś pomiędzy. Coś <strong>przekazujesz drodze cały czas<\u002Fstrong>, niezależnie od tego, czy chcesz, czy nie.<\u002Fp>\n\n      <p>Twoim zadaniem jest sprawić, żeby ten ciągły sygnał <strong>zgadzał się<\u002Fstrong> z tym, co zaraz zrobisz.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- three reasons -->\n    <div class=\"section\">\n      <div class=\"section-eyebrow\">§ 03 — Po co<\u002Fdiv>\n      <h2>Po co właściwie ta cała <em>ceremonia<\u002Fem><\u002Fh2>\n\n      <p>Można by tu poprzestać na <em>„bo egzaminator to ocenia\"<\u002Fem> — i byłaby to prawda. Ale prawda powierzchowna.<\u002Fp>\n\n      <p>Pozycja przed skrętem ma <strong>trzy konkretne powody<\u002Fstrong>:<\u002Fp>\n\n      <ol class=\"reasons\">\n        <li>\n          <div>\n            <p><strong>Informujesz innych.<\u002Fstrong> Świat wokół ciebie zaczyna układać swoje decyzje wokół tego, co ty robisz. Im wcześniej zaczyna widzieć twoje zamiary, tym mniej zaskoczeń ma w zanadrzu.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li>\n          <div>\n            <p><strong>Robisz miejsce.<\u002Fstrong> Skręcasz w prawo i jesteś przy prawej krawędzi? Świetnie — z lewej zostaje pas, którym może spokojnie pojechać ten, kto jedzie prosto. Skręcasz w prawo i siedzisz po środku jezdni? Wszyscy stoją razem z tobą i czekają, aż się zdecydujesz. Tworzysz <strong>korek z jednego auta<\u002Fstrong>.<\u002Fp>\n            <p>To samo z rowerzystą. Jesteś przy prawej krawędzi — rowerzysta widzi, że nie ma jak się obok ciebie wcisnąć, i poczeka grzecznie. Jesteś po środku — myśli, że może się prześlizgnąć z prawej, między tobą a krawężnikiem. I to jest dokładnie ta sytuacja, w której zdarzają się wypadki.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li>\n          <div>\n            <p><strong>Łatwiej skręcasz.<\u002Fstrong> To jest goła geometria. Im lepiej ustawisz pojazd przed skrętem, tym ciaśniej i czyściej go wykonasz. Auto, które wjeżdża w prawy zakręt z prawej krawędzi, robi to prosto, jednym płynnym łukiem. Auto, które wjeżdża w prawy zakręt ze środka jezdni, musi najpierw wyhamować, potem ostro wykręcić w prawo, potem korygować, żeby trafić w pas po skręcie. Trzy razy więcej pracy. Trzy razy więcej miejsc, w których coś może pójść źle.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n\n    <!-- mirror -->\n    <div class=\"section\">\n      <div class=\"section-eyebrow\">§ 04 — Narzędzie<\u002Fdiv>\n      <h2>Prawe lusterko jest twoim <em>przyjacielem<\u002Fem><\u002Fh2>\n\n      <p>Tu pojawia się problem techniczny: jak ty, siedząc po lewej stronie auta, masz właściwie wiedzieć, <strong>gdzie dokładnie jest prawa krawędź?<\u002Fstrong><\u002Fp>\n\n      <p>Z fotela kierowcy nie widzisz prawego boku swojego pojazdu. Możesz go sobie tylko wyobrażać. A wyobraźnia — szczególnie pierwszych godzin za kółkiem — bywa fatalnym przyrządem pomiarowym. Zwykle albo siedzisz dwa metry od krawężnika i myślisz, że jesteś dobrze, albo masz wrażenie, że <em>zaraz się obetrzesz<\u002Fem>, podczas gdy w rzeczywistości jesteś metr za daleko.<\u002Fp>\n\n      <p>Jest na to narzędzie. <strong>Prawe lusterko boczne.<\u002Fstrong><\u002Fp>\n\n      <div class=\"mirror-fig\">\n        <div class=\"mirror-fig-title\">prawe lusterko — trzy stany<\u002Fdiv>\n        <div class=\"mirror-stack\">\n\n          <!-- ROW 1: too far -->\n          <div class=\"mirror-row bad\">\n            <svg viewBox=\"0 0 120 80\" fill=\"none\" aria-hidden=\"true\">\n              <!-- top-down schematic: lane viewed from above -->\n              <!-- road -->\n              <rect x=\"0\" y=\"0\" width=\"120\" height=\"80\" fill=\"#dcd1bd\"><\u002Frect>\n              <!-- center line dashed -->\n              <line x1=\"0\" y1=\"10\" x2=\"120\" y2=\"10\" stroke=\"#8a7e72\" stroke-width=\"1\" stroke-dasharray=\"6 5\" opacity=\"0.5\"><\u002Fline>\n              <!-- curb (right edge, thick amber) -->\n              <line x1=\"0\" y1=\"74\" x2=\"120\" y2=\"74\" stroke=\"#c47a2a\" stroke-width=\"3\"><\u002Fline>\n              <line x1=\"0\" y1=\"77\" x2=\"120\" y2=\"77\" stroke=\"#c47a2a\" stroke-width=\"1\" opacity=\"0.4\"><\u002Fline>\n              <!-- car (centered in lane — too far from curb) -->\n              <rect x=\"36\" y=\"30\" width=\"48\" height=\"22\" rx=\"3\" fill=\"#2a2520\"><\u002Frect>\n              <rect x=\"42\" y=\"34\" width=\"36\" height=\"6\" fill=\"#5a5048\" rx=\"1\"><\u002Frect>\n              <rect x=\"42\" y=\"42\" width=\"36\" height=\"6\" fill=\"#5a5048\" rx=\"1\" opacity=\"0.7\"><\u002Frect>\n              <!-- gap indicator -->\n              <line x1=\"60\" y1=\"54\" x2=\"60\" y2=\"72\" stroke=\"#a85f1a\" stroke-width=\"0.8\" stroke-dasharray=\"2 2\"><\u002Fline>\n              <text x=\"66\" y=\"66\" font-family=\"Lora, serif\" font-size=\"7\" font-style=\"italic\" fill=\"#a85f1a\">~2 m<\u002Ftext>\n            <\u002Fsvg>\n            <div class=\"mirror-meta\">\n              <div class=\"mirror-tag\">stan 1<\u002Fdiv>\n              <div class=\"mirror-verdict\">Za <em>daleko<\u002Fem><\u002Fdiv>\n              <div class=\"mirror-sub\">Krawężnik widać daleko od auta — siedzisz pośrodku pasa.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- ROW 2: correct -->\n          <div class=\"mirror-row good\">\n            <svg viewBox=\"0 0 120 80\" fill=\"none\" aria-hidden=\"true\">\n              <rect x=\"0\" y=\"0\" width=\"120\" height=\"80\" fill=\"#dcd1bd\"><\u002Frect>\n              <line x1=\"0\" y1=\"10\" x2=\"120\" y2=\"10\" stroke=\"#8a7e72\" stroke-width=\"1\" stroke-dasharray=\"6 5\" opacity=\"0.5\"><\u002Fline>\n              <line x1=\"0\" y1=\"74\" x2=\"120\" y2=\"74\" stroke=\"#c47a2a\" stroke-width=\"3\"><\u002Fline>\n              <line x1=\"0\" y1=\"77\" x2=\"120\" y2=\"77\" stroke=\"#c47a2a\" stroke-width=\"1\" opacity=\"0.4\"><\u002Fline>\n              <!-- car positioned close to curb -->\n              <rect x=\"36\" y=\"48\" width=\"48\" height=\"22\" rx=\"3\" fill=\"#2a2520\"><\u002Frect>\n              <rect x=\"42\" y=\"52\" width=\"36\" height=\"6\" fill=\"#5a5048\" rx=\"1\"><\u002Frect>\n              <rect x=\"42\" y=\"60\" width=\"36\" height=\"6\" fill=\"#5a5048\" rx=\"1\" opacity=\"0.7\"><\u002Frect>\n              <!-- tight gap -->\n              <line x1=\"60\" y1=\"71\" x2=\"60\" y2=\"73\" stroke=\"#a85f1a\" stroke-width=\"0.8\"><\u002Fline>\n              <text x=\"66\" y=\"68\" font-family=\"Lora, serif\" font-size=\"7\" font-style=\"italic\" fill=\"#a85f1a\">kilka cm<\u002Ftext>\n              <!-- check -->\n              <circle cx=\"108\" cy=\"12\" r=\"7\" fill=\"#c47a2a\"><\u002Fcircle>\n              <path d=\"M105 12 L107 14 L111 10\" stroke=\"#f5f0e8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath>\n            <\u002Fsvg>\n            <div class=\"mirror-meta\">\n              <div class=\"mirror-tag\">stan 2 · cel<\u002Fdiv>\n              <div class=\"mirror-verdict\">Równolegle, <em>jak szyna<\u002Fem><\u002Fdiv>\n              <div class=\"mirror-sub\">Krawężnik biegnie tuż obok boku auta. To jest właściwa pozycja.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- ROW 3: too close / no visibility -->\n          <div class=\"mirror-row bad\">\n            <svg viewBox=\"0 0 120 80\" fill=\"none\" aria-hidden=\"true\">\n              <rect x=\"0\" y=\"0\" width=\"120\" height=\"80\" fill=\"#dcd1bd\"><\u002Frect>\n              <line x1=\"0\" y1=\"10\" x2=\"120\" y2=\"10\" stroke=\"#8a7e72\" stroke-width=\"1\" stroke-dasharray=\"6 5\" opacity=\"0.5\"><\u002Fline>\n              <line x1=\"0\" y1=\"74\" x2=\"120\" y2=\"74\" stroke=\"#c47a2a\" stroke-width=\"3\"><\u002Fline>\n              <line x1=\"0\" y1=\"77\" x2=\"120\" y2=\"77\" stroke=\"#c47a2a\" stroke-width=\"1\" opacity=\"0.4\"><\u002Fline>\n              <!-- car drifted toward center of road (away from curb) -->\n              <rect x=\"36\" y=\"18\" width=\"48\" height=\"22\" rx=\"3\" fill=\"#2a2520\"><\u002Frect>\n              <rect x=\"42\" y=\"22\" width=\"36\" height=\"6\" fill=\"#5a5048\" rx=\"1\"><\u002Frect>\n              <rect x=\"42\" y=\"30\" width=\"36\" height=\"6\" fill=\"#5a5048\" rx=\"1\" opacity=\"0.7\"><\u002Frect>\n              <!-- question mark over gap -->\n              <text x=\"60\" y=\"60\" font-family=\"Playfair Display, serif\" font-size=\"14\" font-weight=\"700\" font-style=\"italic\" fill=\"#8a7e72\" text-anchor=\"middle\">?<\u002Ftext>\n            <\u002Fsvg>\n            <div class=\"mirror-meta\">\n              <div class=\"mirror-tag\">stan 3<\u002Fdiv>\n              <div class=\"mirror-verdict\">W ogóle <em>nie widać<\u002Fem><\u002Fdiv>\n              <div class=\"mirror-sub\">Krawężnika nie ma w lusterku — siedzisz po środku jezdni.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p>Spójrz w nie, gdy zbliżasz się do skrętu w prawo. To, co masz tam zobaczyć, to krawężnik (albo linia krawędziowa) biegnący <strong>równolegle do boku twojego auta<\u002Fstrong>, w odległości kilku centymetrów. Jak szyna kolejowa biegnąca obok pociągu.<\u002Fp>\n\n      <p>Jeśli widzisz krawężnik daleko od auta — jesteś za daleko od krawędzi. Jeśli krawężnika w lusterku <strong>w ogóle nie widzisz<\u002Fstrong> — siedzisz po środku jezdni. Cała ocena trwa pół sekundy.<\u002Fp>\n\n      <p>To jest narzędzie samokontroli, którego niestety prawie nikt nie używa świadomie w pierwszych godzinach jazdy. Większość początkujących używa prawego lusterka raz na pięć minut, żeby sprawdzić, czy ktoś nie dopędza ich z tej strony. To za mało.<\u002Fp>\n\n      <p class=\"highlight\" style=\"margin-top:14px;\">Przy każdym skręcie w prawo lewa stopa może być na sprzęgle, prawa na hamulcu, ale prawe oko na chwilę musi pójść w prawe lusterko.<\u002Fp>\n\n      <p style=\"margin-top:14px; color: var(--ink-mid); font-size:13.5px;\">Mała czynność, wielka różnica.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- trap -->\n    <div class=\"section\">\n      <div class=\"section-eyebrow\">§ 05 — Pułapka<\u002Fdiv>\n      <h2>Najczęstsza pułapka — pozycja gubi się <em>tam, gdzie patrzysz<\u002Fem><\u002Fh2>\n\n      <p>I tu mam dla ciebie jedną rzecz, która może cię zirytować: <strong>wiem, dlaczego ci to nie wychodzi.<\u002Fstrong><\u002Fp>\n\n      <p>Bo gdy zbliżasz się do skrzyżowania, na którym chcesz skręcić w prawo, twoja głowa <strong>ucieka w lewo<\u002Fstrong>. To naturalne. Tam nadjeżdżają auta z drogi z pierwszeństwem. Tam jest <em>„groźnie\".<\u002Fem> Mózg odruchowo kieruje uwagę w stronę zagrożenia.<\u002Fp>\n\n      <p>Tylko że w tym samym momencie zupełnie tracisz kontrolę nad tym, gdzie jest <strong>prawy bok twojego auta<\u002Fstrong>. Patrzysz w lewo, kręcisz głową w lewo, a w tym samym czasie pojazd dryfuje sobie do środka jezdni. I wjeżdżasz w skręt już z <strong>niewłaściwej pozycji<\u002Fstrong>, choć przed chwilą wszystko było jeszcze do uratowania.<\u002Fp>\n\n      <p>Lekarstwo jest jedno i proste, choć nie do końca intuicyjne:<\u002Fp>\n\n      <div class=\"pull-quote\">\n        <p>Najpierw <strong>pozycja<\u002Fstrong>. Potem <strong>ocena sytuacji<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n\n      <p>Najpierw — gdy auto jeszcze spokojnie toczy się do skrzyżowania — ustawiasz się przy prawej krawędzi. Sprawdzasz prawe lusterko. Masz pewność, że jesteś tam, gdzie powinieneś być.<\u002Fp>\n\n      <p><strong>Dopiero teraz<\u002Fstrong> patrzysz w lewo, oceniasz, kto ma pierwszeństwo, decydujesz, czy wjeżdżasz.<\u002Fp>\n\n      <div class=\"scenario\">\n        <div class=\"scenario-label\">W praktyce<\u002Fdiv>\n        <p>Przy znaku <em>STOP<\u002Fem> ta kolejność jest najprostsza, bo i tak musisz się zatrzymać. Pełne 100% uwagi możesz poświęcić na to, żeby stanąć dokładnie tam, gdzie trzeba. I dopiero z <em>dobrego miejsca<\u002Fem> patrzysz w lewo.<\u002Fp>\n        <p style=\"margin-top:10px;\">Przy znaku „ustąp pierwszeństwa\" zasada jest ta sama. Może się zatrzymasz, może nie — ale decyzję podejmujesz z <em>właściwej pozycji<\u002Fem> na jezdni, nie z dowolnej.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- closing -->\n    <div class=\"section\">\n      <div class=\"section-eyebrow\">§ 06 — Co dalej<\u002Fdiv>\n      <h2>Co zostaje na <em>potem<\u002Fem><\u002Fh2>\n\n      <p>Wszystkie kolejne szczegóły — co dokładnie ze skrętem w lewo na drodze jednokierunkowej (bo to jest osobna pułapka), co z kontrolą lewą ręką podczas samego skrętu, co gdy łuk jest tak ostry, że trzeba zmienić chwyt — to warianty tej samej historii. Zobaczysz je w drugiej części.<\u002Fp>\n\n      <p>Ale jedno przekonanie zabierz ze sobą już teraz, bo zmieni ci ono w pierwszych godzinach naprawdę dużo:<\u002Fp>\n\n      <div class=\"takeaway\">\n        <div class=\"takeaway-label\">Zabierz ze sobą<\u002Fdiv>\n        <p>Twoja pozycja na jezdni jest sygnałem, którego <em>nie da się wyłączyć<\u002Fem>. Albo zgadza się z tym, co zaraz zrobisz, albo wprowadza wszystkich dookoła w błąd. Trzeciej opcji nie ma.<\u002Fp>\n        <p style=\"margin-top:14px;\">Skręt to nie jest <em>ruch kierownicy<\u002Fem>. Skręt to <em>ułożenie auta<\u002Fem>.<\u002Fp>\n        <div class=\"small\">A ruch kierownicy to tylko ostatnia chwila tego, co już od pół minuty mówi się głośno do całej drogi.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ornament\" style=\"margin-top: 28px;\">\n        <span class=\"line\"><\u002Fspan>\n        <span class=\"dot\"><\u002Fspan>\n        <span class=\"line\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div class=\"footer\">\n    <div style=\"display:flex; flex-direction:column; gap:2px;\">\n      <span style=\"font-family:'Lora',serif; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-soft);\">OSK<\u002Fspan>\n      <span style=\"font-family:'Playfair Display',serif; font-size:17px; font-weight:900; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink); line-height:1;\">Extreme<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto; display:flex; gap:3px; align-items:center;\">\n      <div class=\"fi-arrow dim\"><\u002Fdiv>\n      <div class=\"fi-arrow dim\"><\u002Fdiv>\n      <div class=\"fi-arrow\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer-meta\">\n    <span>Skręt · cz. 1/2<\u002Fspan>\n    <span class=\"next\">Część 2 →<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
